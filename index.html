<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore - Cửa Hàng Công Nghệ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f4f6f9;color:#333}
.nav{background:#1e293b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;gap:15px}
.logo{font-size:1.5rem;font-weight:700;color:#38bdf8}
.search{flex:1;max-width:450px}
.search input{width:100%;padding:10px 15px;border-radius:20px;border:none;outline:none}
.cart-btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer}
.cats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:25px 0}
.cat{padding:8px 20px;border:1px solid #cbd5e1;background:#fff;border-radius:20px;cursor:pointer;font-weight:500}
.cat.active,.cat:hover{background:#1e293b;color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:25px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:space-between}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:15px}
.price{color:#e11d48;font-weight:700;font-size:1.15rem;margin:10px 0 15px}
.btn{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:flex-end}
.box{width:380px;max-width:100%;background:#fff;height:100%;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.items{flex:1;overflow-y:auto;margin:15px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.qty button{padding:4px 10px;margin:0 5px;cursor:pointer}
.pay{width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<header class="nav">
  <div class="logo">🛒 TechStore</div>
  <div class="search"><input id="q" placeholder="Tìm sản phẩm..."></div>
  <button class="cart-btn" onclick="toggle()">Giỏ hàng (<span id="cnt">0</span>)</button>
</header>
<div class="cats">
  <button class="cat active" onclick="setCat('all',this)">Tất cả</button>
  <button class="cat" onclick="setCat('laptop',this)">Laptop</button>
  <button class="cat" onclick="setCat('phone',this)">Điện thoại</button>
  <button class="cat" onclick="setCat('acc',this)">Phụ kiện</button>
</div>
<main class="wrap"><div class="grid" id="list"></div></main>
<div class="modal" id="modal" onclick="if(event.target===this)toggle()">
  <div class="box">
    <div style="display:flex;justify-content:space-between"><h2>Giỏ hàng</h2><button onclick="toggle()" style="border:none;background:none;font-size:1.2rem;cursor:pointer">✖</button></div>
    <div class="items" id="cItems"></div>
    <div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem"><span>Tổng:</span><span id="total">0 ₫</span></div>
      <button class="pay" onclick="pay()">Thanh toán ngay</button>
    </div>
  </div>
</div>
<script>
const db=[
  {id:1,name:"MacBook Air M2",price:24500000,cat:"laptop",img:"https://unsplash.com"},
  {id:2,name:"Dell XPS 13 Plus",price:32900000,cat:"laptop",img:"https://unsplash.com"},
  {id:3,name:"iPhone 15 Pro Max",price:29900000,cat:"phone",img:"https://unsplash.com"},
  {id:4,name:"Galaxy S24 Ultra",price:27500000,cat:"phone",img:"https://unsplash.com"},
  {id:5,name:"Sony WH-1000XM5",price:6990000,cat:"acc",img:"https://unsplash.com"},
  {id:6,name:"Logitech MX Master 3S",price:2290000,cat:"acc",img:"https://unsplash.com"}
];
let cart=JSON.parse(localStorage.getItem('ts_cart')||'[]'),cat='all';
const fmt=n=>n.toLocaleString('vi-VN')+' ₫';
const save=()=>localStorage.setItem('ts_cart',JSON.stringify(cart));
function render(){
  const kw=document.getElementById('q').value.toLowerCase();
  const f=db.filter(p=>(cat==='all'||p.cat===cat)&&p.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=f.map(p=>`<div class="card"><div><img src="${p.img}"><h3>${p.name}</h3></div><div><div class="price">${fmt(p.price)}</div><button class="btn" onclick="add(${p.id})">+ Thêm vào giỏ</button></div></div>`).join('');
}
function setCat(c,b){cat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}
function add(id){const x=cart.find(i=>i.id===id);x?x.qty++:cart.push({...db.find(p=>p.id===id),qty:1});save();ui();}
function chg(id,d){const x=cart.find(i=>i.id===id);x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);save();ui();}
function ui(){
  document.getElementById('cnt').innerText=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cItems').innerHTML=cart.length?cart.map(i=>`<div class="item"><div><b>${i.name}</b><br><small style="color:#e11d48">${fmt(i.price)}</small></div><div class="qty"><button onclick="chg(${i.id},-1)">-</button>${i.qty}<button onclick="chg(${i.id},1)">+</button></div></div>`).join(''):'<p style="text-align:center;margin-top:30px">Giỏ hàng trống</p>';
  document.getElementById('total').innerText=fmt(cart.reduce((s,i)=>s+i.price*i.qty,0));
}
function toggle(){const m=document.getElementById('modal');m.style.display=m.style.display==='flex'?'none':'flex';}
function pay(){if(!cart.length)return alert('Giỏ hàng trống!');alert('Đặt hàng thành công!');cart=[];save();ui();toggle();}
document.getElementById('q').oninput=render;
render();ui();
</script>
</body>
</html>
